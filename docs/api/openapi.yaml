        content:
          application/json:
            schema: {$ref: '#/components/schemas/MissionDeclineRequest'}
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionSummary'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /missions/{assignmentId}/updates/{clientUpdateId}:
    put:
      tags: [Missions]
      summary: Send an update or report an outcome
      description: |
        The device generates `clientUpdateId` when the button is pressed, even offline, and resends until it gets a response.
        The first send returns `201`; resends return `200` and create no new record (BR18).

        `CANNOT_REACH` returns the case to `TRIAGED` and raises an alert; the other three outcomes move it to `RESOLVED`.
        If the assignment ended before the update arrived, the server still saves it but changes no status (`applied` is `false`).
        Coordinators updating on behalf of a team use this same operation; the timeline records who entered it.
      operationId: submitMissionUpdate
      x-roles: [TEAM, COORDINATOR, ADMIN]
      x-scope: 'TEAM: their own team missions'
      x-stories: [US18]
      parameters:
        - {$ref: '#/components/parameters/AssignmentIdPath'}
        - {name: clientUpdateId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MissionUpdateRequest'}
            examples:
              rescued: {$ref: '#/components/examples/MissionOutcomeExample'}
      responses:
        '201':
          description: First receipt of the update
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionUpdateReceipt'}
              examples:
                applied: {$ref: '#/components/examples/MissionUpdateReceiptExample'}
        '200':
          description: Already received; no new record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionUpdateReceipt'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /analytics/events/{eventId}/dashboard:
    get:
      tags: [Analytics]
      summary: Event dashboard
      description: Figures for SCR-40. Stuck cases are overdue cases, cases with under 5 minutes left and cases whose team has gone silent.
      operationId: getEventDashboard
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US19]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      responses:
        '200':
          description: Dashboard figures
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDashboard'}
              examples:
                drill: {$ref: '#/components/examples/DashboardExample'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /analytics/events/{eventId}/after-action:
    get:
      tags: [Analytics]
      summary: After-action report
      operationId: getAfterActionReport
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US19]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      responses:
        '200':
          description: Report (SCR-41)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AfterActionReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /analytics/events/{eventId}/after-action/lessons:
    put:
      tags: [Analytics]
      summary: Save lessons learned
      operationId: saveLessonsLearned
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US19]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LessonsLearnedRequest'}
      responses:
        '204': {description: Saved}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /analytics/events/{eventId}/ai-quality:
    get:
      tags: [Analytics]
      summary: AI quality
      description: Compares AI values with final human values, on cases a person has finalised (AC-US20).
      operationId: getAiQuality
      x-roles: [ADMIN]
      x-stories: [US20]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      responses:
        '200':
          description: SCR-53 figures
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiQuality'}
              examples:
                drill: {$ref: '#/components/examples/AiQualityExample'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /analytics/events/{eventId}/export:
    get:
      tags: [Analytics]
      summary: Export Excel
      description: Excludes phone numbers by default. Each export writes `EXPORT` to the audit log (BR22, AC-US19).
      operationId: exportEventData
      x-roles: [ADMIN]
      x-stories: [US19, US24]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
        - {name: includePhones, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /users:
    get:
      tags: [Users]
      summary: List accounts
      operationId: listUsers
      x-roles: [ADMIN]
      x-stories: [US21]
      parameters:
        - {name: role, in: query, schema: {$ref: '#/components/schemas/UserRole'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {name: q, in: query, schema: {type: string}, description: Search by name or email}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Users]
      summary: Invite someone
      description: |
        Creates an `INVITED` account and a single-use invitation link valid for 7 days. The `TEAM` role requires `teamId`.
        V1 has no email service: `inviteUrl` is returned once for the administrator to send themselves.
      operationId: inviteUser
      x-roles: [ADMIN]
      x-stories: [US21]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInviteRequest'}
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserInviteResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserIdPath'}
    get:
      tags: [Users]
      summary: Account detail
      operationId: getUser
      x-roles: [ADMIN]
      x-stories: [US21]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Users]
      summary: Edit an account
      operationId: updateUser
      x-roles: [ADMIN]
      x-stories: [US21]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200':
          description: Account after editing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{userId}/disable:
    post:
      tags: [Users]
      summary: Disable an account
      description: Takes effect on the next request, because the server checks account status on every request (AC-US21).
      operationId: disableUser
      x-roles: [ADMIN]
      x-stories: [US21]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      responses:
        '200':
          description: Account disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{userId}/enable:
    post:
      tags: [Users]
      summary: Re-enable an account
      operationId: enableUser
      x-roles: [ADMIN]
      x-stories: [US21]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      responses:
        '200':
          description: Account re-enabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{userId}/invitation:
    post:
      tags: [Users]
      summary: Recreate the invitation link
      description: The old link stops working. Only for `INVITED` accounts.
      operationId: resendInvitation
      x-roles: [ADMIN]
      x-stories: [US21]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      responses:
        '201':
          description: New link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /audit-logs:
    get:
      tags: [Audit]
      summary: Audit log
      description: The anonymisation deadline comes from `listEvents`.
      operationId: listAuditLogs
      x-roles: [ADMIN]
      x-stories: [US24]
      parameters:
        - {name: actorId, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}, description: 'For example VIEW_PHONE, EXPORT, LOGIN_FAILED'}
        - {name: entityType, in: query, schema: {type: string}}
        - {name: entityId, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: A page of the audit log, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhooks/zalo-oa:
    post:
      tags: [Webhooks]
      summary: Receive a Zalo OA message
      description: |
        Creates a message with channel `ZALO_OA` and replies with a tracking code through the bot. A wrong signature is rejected (AC-US06).
        Saves the message and returns at once; everything else runs in the background. In the Could group, done last.
      operationId: receiveZaloMessage
      security:
        - zaloSignature: []
      x-roles: [ZALO_OA]
      x-stories: [US06]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZaloWebhookEvent'}
      responses:
        '200': {description: Received}
        '401':
          description: '`ZALO_SIGNATURE_INVALID`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '500': {$ref: '#/components/responses/InternalError'}

  /health:
    get:
      tags: [System]
      summary: Check the service
      description: No personal information. `degraded` means messages are still received but the Worker or AI is slow (BR07).
      operationId: getHealth
      security: []
      x-roles: [PUBLIC]
      x-stories: []
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: Cannot connect to the database
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 60-minute JWT, no refresh token. A disabled account loses access on its next request.
    zaloSignature:
      type: apiKey
      in: header
      name: X-ZEvent-Signature
      description: Signature Zalo sends with the webhook. The header name and calculation need checking against the Zalo OA documentation when registering the OA.

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      description: Rows per page
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    EventIdQuery:
      name: eventId
      in: query
      description: Disaster event
      schema: {type: string, format: uuid}
    EventIdQueryRequired:
      name: eventId
      in: query
      required: true
      description: The selected disaster event
      schema: {type: string, format: uuid}
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TrackingCodePath:
      name: trackingCode
      in: path
      required: true
      description: Public tracking code
      schema: {type: string, maxLength: 12, example: SOS-7K2Q}
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TeamIdPath:
      name: teamId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    ValidationError:
      description: Invalid data sent (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          examples:
            missingPlace: {$ref: '#/components/examples/ValidationErrorExample'}
    InvalidCredentials:
      description: Wrong login details (`AUTH_INVALID_CREDENTIALS`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          examples:
            invalid: {$ref: '#/components/examples/InvalidCredentialsExample'}
    Unauthorized:
      description: Missing, wrong or expired token (`AUTH_TOKEN_INVALID`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Forbidden:
      description: No permission (`ACCESS_DENIED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    NotFound:
      description: Not found (`RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Conflict:
      description: The operation does not fit the current state (`BUSINESS_CONFLICT` or a more specific code)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    VersionConflict:
      description: The case was changed by someone else (`CASE_VERSION_CONFLICT`) or is not in a suitable state (`CASE_STATE_INVALID`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/VersionConflictProblem'}
          examples:
            staleVersion: {$ref: '#/components/examples/VersionConflictExample'}
    PriorityReasonRequired:
      description: Priority lowered without a reason (`PRIORITY_REASON_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    AttachmentLimitReached:
      description: The message already has 4 images (`ATTACHMENT_LIMIT_REACHED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    InvitationInvalid:
      description: Invitation link wrong, expired or already used (`INVITATION_INVALID`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    FileTooLarge:
      description: Image larger than 5 MB (`FILE_TOO_LARGE`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    UnsupportedMediaType:
      description: File format not accepted (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    RateLimited:
      description: Too many calls (`RATE_LIMITED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ConfirmationRequired:
      description: An IP sent over 10 messages in 10 minutes; confirm and resend (`RATE_LIMIT_CONFIRM_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/RateLimitConfirmProblem'}
          examples:
            needConfirm: {$ref: '#/components/examples/RateLimitConfirmExample'}
    InternalError:
      description: Unexpected error (`INTERNAL_SERVER_ERROR`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}

  schemas:
    # ---------- Errors and pagination
    ProblemDetails:
      type: object
      description: Error per RFC 7807. The frontend relies on `errorCode`, not `detail`.
      required: [title, status, errorCode, traceId]
      properties:
        type: {type: string, default: about:blank}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errorCode: {type: string}
        traceId: {type: string}
        errors:
          type: object
          description: Errors per field, only with `VALIDATION_FAILED`
          additionalProperties:
            type: array
            items: {type: string}
    VersionConflictProblem:
      allOf:
        - {$ref: '#/components/schemas/ProblemDetails'}
        - type: object
          properties:
            currentVersion: {type: integer, description: 'Version currently on the server'}
    AssignmentConflictProblem:
      allOf:
        - {$ref: '#/components/schemas/VersionConflictProblem'}
        - type: object
          properties:
            assignedTeamName: {type: string}
            assignedByName: {type: string}
    RateLimitConfirmProblem:
      allOf:
        - {$ref: '#/components/schemas/ProblemDetails'}
        - type: object
          required: [confirmToken]
          properties:
            confirmToken: {type: string, description: 'Send back in `PublicReportRequest.confirmToken`'}
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalItems: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}

    # ---------- Enums, matching docs/database/soslink.dbml
    UserRole: {type: string, enum: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]}
    UserStatus: {type: string, enum: [INVITED, ACTIVE, DISABLED]}
    EventStatus: {type: string, enum: [OPEN, CLOSED]}
    ReportChannel: {type: string, enum: [PUBLIC_FORM, VOLUNTEER_PASTE, ZALO_OA]}
    AiStatus: {type: string, enum: [PENDING, OK, FAILED, TIMEOUT]}
    CaseStatus: {type: string, enum: [NEW, TRIAGED, ASSIGNED, EN_ROUTE, RESOLVED, INVALID, MERGED]}
    Priority: {type: string, enum: [P1, P2, P3, P4]}
    VerificationStatus: {type: string, enum: [UNVERIFIED, REACHED, UNREACHABLE]}
    LocationSource: {type: string, enum: [GPS, GEOCODED, MANUAL_PIN, NONE]}
    MergeSuggestionStatus: {type: string, enum: [PENDING, ACCEPTED, REJECTED]}
    AssignmentStatus:
      type: string
      description: In V1 accepting means setting off, so `ACCEPTED` is reserved but unused.
      enum: [OFFERED, ACCEPTED, DECLINED, TIMED_OUT, EN_ROUTE, COMPLETED, CANCELLED]
    AssignmentOutcome: {type: string, enum: [RESCUED, HANDLED_BY_OTHERS, CANNOT_REACH, NOT_FOUND]}
    TeamStatus: {type: string, enum: [AVAILABLE, BUSY, OFF_DUTY]}
    VehicleType: {type: string, enum: [BOAT, CAR, ON_FOOT, OTHER]}
    AlertType: {type: string, enum: [SLA_NOT_ASSIGNED, TEAM_NOT_ACCEPTED, TEAM_NO_UPDATE, TEAM_CANNOT_REACH, NEW_INFO_ON_ACTIVE_CASE]}

    # ---------- API-only enums
    VulnerableGroup: {type: string, enum: [ELDERLY, INFANT, CHILD, PREGNANT, INJURED, DISABLED]}
    PublicStep:
      type: string
      description: |
        `RECEIVED` maps to case `NEW`. `PROCESSING` maps to `TRIAGED`. `TEAM_ASSIGNED` maps to `ASSIGNED`, `EN_ROUTE`.
        `CLOSED` maps to `RESOLVED`, `INVALID`.
      enum: [RECEIVED, PROCESSING, TEAM_ASSIGNED, CLOSED]
    DeclineReason:
      type: string
      description: Busy on another mission · Cannot reach this area · Vehicle broken · Other reason
      enum: [BUSY, AREA_UNREACHABLE, VEHICLE_BROKEN, OTHER]
    TeamUpdateKind: {type: string, enum: [EN_ROUTE, OUTCOME, NOTE]}

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lng: {type: number, format: double, minimum: -180, maximum: 180}

    # ---------- Public
    FormStatus:
      type: object
      required: [accepting, hotline, events]
      properties:
        accepting: {type: boolean}
        hotline: {type: string, example: '112'}
        events:
          type: array
          items: {$ref: '#/components/schemas/OpenEvent'}
    OpenEvent:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        areaDescription: {type: string}
    PublicReportRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      anyOf:
        - required: [gps]
        - required: [placeText]
      properties:
        idempotencyKey: {type: string, format: uuid, description: 'Generated by the sender device'}
        eventId: {type: string, format: uuid, description: 'Empty when only one event is open; required when several are open'}
        gps: {$ref: '#/components/schemas/GeoPoint'}
        placeText: {type: string, maxLength: 500}
        situationText: {type: string, maxLength: 2000}
        peopleCount: {type: integer, minimum: 1, description: 'The value 5 means 5 or more people'}
        vulnerable:
          type: array
          items: {$ref: '#/components/schemas/VulnerableGroup'}
        phone: {type: string, maxLength: 20}
        confirmToken: {type: string, description: 'Taken from the `RATE_LIMIT_CONFIRM_REQUIRED` error'}
    PublicReportCreated:
      type: object
      additionalProperties: false
      required: [trackingCode, receivedAt, currentStep, hotline]
      properties:
        trackingCode: {type: string}
        receivedAt: {type: string, format: date-time}
        currentStep: {$ref: '#/components/schemas/PublicStep'}
        hotline: {type: string}
    TrackResponse:
      type: object
      description: Other fields are deliberately forbidden so no personal data leaks (BR19).
      additionalProperties: false
      required: [trackingCode, currentStep, steps, hotline]
      properties:
        trackingCode: {type: string}
        currentStep: {$ref: '#/components/schemas/PublicStep'}
        steps:
          type: array
          items: {$ref: '#/components/schemas/TrackStep'}
        hotline: {type: string}
    TrackStep:
      type: object
      additionalProperties: false
      required: [step]
      properties:
        step: {$ref: '#/components/schemas/PublicStep'}
        reachedAt: {type: string, format: date-time, description: 'Absent means this step is not reached yet'}
    AttachmentRef:
      type: object
      required: [id, mimeType, sizeBytes, createdAt]
      properties:
        id: {type: string, format: uuid}
        mimeType: {type: string}
        sizeBytes: {type: integer, maximum: 5242880}
        createdAt: {type: string, format: date-time}

    # ---------- Auth and profile
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, description: Seconds, example: 3600}
        user: {$ref: '#/components/schemas/UserProfile'}
    UserProfile:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        phone: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        teamId: {type: string, format: uuid}
        teamName: {type: string}
    ProfileUpdateRequest:
      type: object
      description: There is no role field (AC-US02).
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, maxLength: 20}
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 8}
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: {type: string}
    InvitationInfo:
      type: object
      required: [email, role, expiresAt]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        teamName: {type: string}
        expiresAt: {type: string, format: date-time}
    InvitationAcceptRequest:
      type: object
      required: [token, fullName, password]
      properties:
        token: {type: string}
        fullName: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, format: password, minLength: 8}

    # ---------- Events and configuration
    Event:
      type: object
      required: [id, name, status, slaP1Minutes, slaP2Minutes, slaP3Minutes, teamAcceptMinutes, teamUpdateMinutes, openedAt, reportCount, caseCount]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        areaDescription: {type: string}
        status: {$ref: '#/components/schemas/EventStatus'}
        slaP1Minutes: {type: integer, minimum: 1, example: 10}
        slaP2Minutes: {type: integer, minimum: 1, example: 30}
        slaP3Minutes: {type: integer, minimum: 1, example: 120}
        teamAcceptMinutes: {type: integer, minimum: 1, example: 5}
        teamUpdateMinutes: {type: integer, minimum: 1, example: 30}
        openedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time}
        anonymizeDueAt: {type: string, format: date-time, description: '`closedAt` plus 90 days'}
        anonymizedAt: {type: string, format: date-time}
        reportCount: {type: integer, minimum: 0}
        caseCount: {type: integer, minimum: 0}
    EventCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        areaDescription: {type: string}
    EventUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        areaDescription: {type: string}
        slaP1Minutes: {type: integer, minimum: 1}
        slaP2Minutes: {type: integer, minimum: 1}
        slaP3Minutes: {type: integer, minimum: 1}
        teamAcceptMinutes: {type: integer, minimum: 1}
        teamUpdateMinutes: {type: integer, minimum: 1}
    EventOverview:
      type: object
      required: [eventId, p1Unassigned, pendingReview, noLocation, openAlerts, generatedAt]
      properties:
        eventId: {type: string, format: uuid}
        p1Unassigned: {type: integer, minimum: 0}
        pendingReview: {type: integer, minimum: 0}
        noLocation: {type: integer, minimum: 0}
        openAlerts: {type: integer, minimum: 0}
        generatedAt: {type: string, format: date-time}
    DangerKeyword:
      type: object
      required: [id, keyword, minimumPriority, isActive]
      properties:
        id: {type: string, format: uuid}
        keyword: {type: string}
        minimumPriority: {$ref: '#/components/schemas/Priority'}
        isActive: {type: boolean}
    DangerKeywordCreateRequest:
      type: object
      required: [keyword]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 80}
        minimumPriority:
          allOf:
            - {$ref: '#/components/schemas/Priority'}
          default: P1
    AdminUnit:
      type: object
      required: [id, code, name, level]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [PROVINCE, COMMUNE]}
        parentId: {type: string, format: uuid}

    # ---------- Original messages
    ReportCreateForm:
      type: object
      required: [eventId, idempotencyKey]
      properties:
        eventId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
        text: {type: string, description: 'Post content, stored verbatim'}
        sourceUrl: {type: string, format: uri, description: 'Link to the original post'}
        photos:
          type: array
          maxItems: 4
          items: {type: string, format: binary}
    ReportSummary:
      type: object
      description: A row at SCR-10, SCR-11. Case fields exist only once the message belongs to a case.
      required: [id, eventId, channel, sourceLabel, receivedAt, aiStatus]
      properties:
        id: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        channel: {$ref: '#/components/schemas/ReportChannel'}
        sourceLabel: {type: string, description: 'Derived from the channel and the domain of `sourceUrl`, for example Form, Zalo OA, Facebook, Dán tin'}
        textPreview: {type: string, maxLength: 200}
        receivedAt: {type: string, format: date-time}
        aiStatus: {$ref: '#/components/schemas/AiStatus'}
        isRescueRequest: {type: boolean, description: '`false` shows the label for may not be a call for help'}
        caseId: {type: string, format: uuid}
        caseCode: {type: string}
        caseStatus: {$ref: '#/components/schemas/CaseStatus'}
        casePriority: {$ref: '#/components/schemas/Priority'}
        needsHumanRead: {type: boolean}
        verification: {$ref: '#/components/schemas/VerificationStatus'}
        myVerificationNote: {type: string, description: 'Note the viewer entered during a verification call'}
        submittedByName: {type: string}
    ReportDetail:
      type: object
      description: Original message. `rawText` is shown verbatim (BR05), so it may contain phone numbers the sender wrote.
      required: [id, channel, sourceLabel, receivedAt, aiStatus, attachments]
      properties:
        id: {type: string, format: uuid}
        channel: {$ref: '#/components/schemas/ReportChannel'}
        sourceLabel: {type: string}
        sourceUrl: {type: string, format: uri}
        rawText: {type: string}
        contactPhoneMasked: {type: string, example: 09xxxxx234}
        gps: {$ref: '#/components/schemas/GeoPoint'}
        formPeopleCount: {type: integer}
        formVulnerable:
          type: array
          items: {$ref: '#/components/schemas/VulnerableGroup'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/AttachmentRef'}
        aiStatus: {$ref: '#/components/schemas/AiStatus'}
        submittedByName: {type: string}
        receivedAt: {type: string, format: date-time}

    # ---------- AI
    AiOutput:
      type: object
      description: Fixed schema of the AI output, see 02-scope.md section 5. Fields the AI is unsure about are `null`.
      properties:
        isRescueRequest: {type: boolean, nullable: true}
        address:
          type: object
          nullable: true
          properties:
            raw: {type: string, nullable: true}
            commune: {type: string, nullable: true}
            landmark: {type: string, nullable: true}
        phones:
          type: array
          items: {type: string}
        peopleCount: {type: integer, nullable: true}
        vulnerable:
          type: array
          items: {$ref: '#/components/schemas/VulnerableGroup'}
        situation: {type: string, nullable: true}
        needs:
          type: array
          items: {type: string}
        dangerSignals:
          type: array
          items: {type: string}
        suggestedPriority: {type: string, nullable: true, enum: [P1, P2, P3, P4, null]}
        reason: {type: string, nullable: true}
        possiblyOld: {type: boolean, nullable: true}
        confidence: {type: number, nullable: true, minimum: 0, maximum: 1}
    AiExtraction:
      type: object
      required: [id, status, attempt, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AiStatus'}
        model: {type: string, description: 'From configuration at call time'}
        promptVersion: {type: string}
        attempt: {type: integer, minimum: 1, maximum: 3, description: 'Up to 3 attempts'}
        confidence: {type: number, minimum: 0, maximum: 1}
        suggestedPriority: {$ref: '#/components/schemas/Priority'}
        isRescueRequest: {type: boolean}
        possiblyOld: {type: boolean}
        latencyMs: {type: integer}
        output: {$ref: '#/components/schemas/AiOutput'}
        createdAt: {type: string, format: date-time}

    # ---------- Cases
    CaseSummary:
      type: object
      required: [id, code, eventId, status, priority, needsHumanRead, verification, locationSource, overdue, reportCount, aiStatus, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: '#1042'}
        eventId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CaseStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        summary: {type: string}
        place: {type: string, description: 'Short place name for lists'}
        peopleCount: {type: integer, minimum: 0}
        needsHumanRead: {type: boolean}
        isRescueRequest: {type: boolean}
        possiblyOld: {type: boolean}
        verification: {$ref: '#/components/schemas/VerificationStatus'}
        location: {$ref: '#/components/schemas/GeoPoint'}
        locationSource: {$ref: '#/components/schemas/LocationSource'}
        channel: {$ref: '#/components/schemas/ReportChannel'}
        sourceLabel: {type: string}
        reportCount: {type: integer, minimum: 1}
        aiStatus: {$ref: '#/components/schemas/AiStatus'}
        slaDueAt: {type: string, format: date-time, description: 'P4 has no deadline'}
        overdue: {type: boolean}
        teamName: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, minimum: 0, description: 'Send back when editing to prevent overwrites'}
    CaseDetail:
      allOf:
        - {$ref: '#/components/schemas/CaseSummary'}
        - type: object
          required: [reports, mergeSuggestions, verifications, phonesMasked, vulnerable, matchedKeywords]
          properties:
            addressText: {type: string}
            communeId: {type: string, format: uuid}
            locationConfidence: {type: number, minimum: 0, maximum: 1}
            phonesMasked:
              type: array
              items: {type: string}
            vulnerable:
              type: array
              items: {$ref: '#/components/schemas/VulnerableGroup'}
            needs:
              type: array
              items: {type: string}
            priorityReason: {type: string}
            matchedKeywords:
              type: array
              items: {type: string}
            peopleRescued: {type: integer, minimum: 0}
            mergedIntoId: {type: string, format: uuid}
            invalidReason: {type: string}
            reviewedByName: {type: string}
            reviewedAt: {type: string, format: date-time}
            resolvedAt: {type: string, format: date-time}
            reports:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/ReportDetail'}
            latestExtraction: {$ref: '#/components/schemas/AiExtraction'}
            mergeSuggestions:
              type: array
              items: {$ref: '#/components/schemas/MergeSuggestion'}
            activeAssignment: {$ref: '#/components/schemas/Assignment'}
            verifications:
              type: array
              items: {$ref: '#/components/schemas/VerificationLog'}
    CaseUpdateRequest:
      type: object
      description: Send only changed fields. Fields not sent stay as they are.
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: {type: integer, minimum: 0}
        summary: {type: string, nullable: true}
        addressText: {type: string, nullable: true}
        communeId: {type: string, format: uuid, nullable: true}
        phones:
          type: array
          items: {type: string, maxLength: 20}
        peopleCount: {type: integer, nullable: true, minimum: 0}
        vulnerable:
          type: array
          items: {$ref: '#/components/schemas/VulnerableGroup'}
        needs:
          type: array
          items: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        priorityReason: {type: string, description: 'Required when lowering'}
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 0}
    LocationPinRequest:
      allOf:
        - {$ref: '#/components/schemas/GeoPoint'}
        - {$ref: '#/components/schemas/VersionRequest'}
    CaseInvalidateRequest:
      allOf:
        - {$ref: '#/components/schemas/VersionRequest'}
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1}
    CaseResolveRequest:
      allOf:
        - {$ref: '#/components/schemas/VersionRequest'}
        - type: object
          required: [note]
          properties:
            note: {type: string, minLength: 1}
            peopleRescued: {type: integer, minimum: 0}
    MergeRequest:
      allOf:
        - {$ref: '#/components/schemas/VersionRequest'}
        - type: object
          required: [intoCaseId]
          properties:
            intoCaseId: {type: string, format: uuid, description: Main case}
            suggestionId: {type: string, format: uuid, description: 'The suggestion being accepted, if any'}
    MergeSuggestion:
      type: object
      required: [id, caseId, candidateCaseId, candidateCaseCode, reason, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        candidateCaseId: {type: string, format: uuid}
        candidateCaseCode: {type: string}
        candidatePreview: {type: string}
        reason: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        status: {$ref: '#/components/schemas/MergeSuggestionStatus'}
        decidedByName: {type: string}
        decidedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    PhoneRevealRequest:
      type: object
      properties:
        purpose: {type: string, description: Written to the audit log, example: Gọi xác minh}
    PhoneRevealResponse:
      type: object
      required: [caseId, phones, revealedAt]
      properties:
        caseId: {type: string, format: uuid}
        phones:
          type: array
          items: {type: string}
        revealedAt: {type: string, format: date-time}
    VerificationCreateRequest:
      type: object
      required: [result]
      properties:
        result: {type: string, enum: [REACHED, UNREACHABLE]}
        note: {type: string}
    VerificationLog:
      type: object
      required: [id, caseId, result, createdByName, createdAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        result: {$ref: '#/components/schemas/VerificationStatus'}
        note: {type: string}
        createdByName: {type: string}
        createdAt: {type: string, format: date-time}
    CaseEvent:
      type: object
      required: [id, type, createdAt]
      properties:
        id: {type: integer, format: int64}
        type: {type: string, example: PRIORITY_CHANGED}
        fromValue: {description: 'Value before the change'}
        toValue: {description: 'Value after the change'}
        note: {type: string}
        actorName: {type: string, description: 'Absent means the system did it'}
        createdAt: {type: string, format: date-time}
    NotifyTeamRequest:
      type: object
      properties:
        note: {type: string}

    # ---------- Assignment
    TeamSuggestionList:
      type: object
      required: [caseId, distanceNote, suggestions]
      properties:
        caseId: {type: string, format: uuid}
        distanceNote: {type: string}
        suggestions:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/TeamSuggestion'}
    TeamSuggestion:
      type: object
      required: [teamId, teamName, vehicle, activeAssignments]
      properties:
        teamId: {type: string, format: uuid}
        teamName: {type: string}
        vehicle: {$ref: '#/components/schemas/VehicleType'}
        distanceKm: {type: number, minimum: 0}
        activeAssignments: {type: integer, minimum: 0}
    AssignmentCreateRequest:
      allOf:
        - {$ref: '#/components/schemas/VersionRequest'}
        - type: object
          required: [teamId]
          properties:
            teamId: {type: string, format: uuid}
    AssignmentCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    Assignment:
      type: object
      required: [id, caseId, caseCode, teamId, teamName, status, assignedByName, acceptDueAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        caseCode: {type: string}
        teamId: {type: string, format: uuid}
        teamName: {type: string}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        outcome: {$ref: '#/components/schemas/AssignmentOutcome'}
        peopleRescued: {type: integer, minimum: 0}
        declineReason: {type: string}
        note: {type: string}
        assignedByName: {type: string}
        acceptDueAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time}
        lastUpdateAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}

    # ---------- Alerts and teams
    Alert:
      type: object
      required: [id, caseId, caseCode, type, createdAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        caseCode: {type: string}
        assignmentId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/AlertType'}
        teamName: {type: string}
        minutes: {type: integer, description: 'Minutes overdue or silent'}
        acknowledgedByName: {type: string}
        acknowledgedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    Team:
      type: object
      required: [id, name, phone, vehicle, status, isActive, activeAssignments, silent, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
        vehicle: {$ref: '#/components/schemas/VehicleType'}
        capacity: {type: integer, minimum: 0}
        areaDescription: {type: string}
        status: {$ref: '#/components/schemas/TeamStatus'}
        isActive: {type: boolean}
        leaderName: {type: string, description: 'The `TEAM` account of the team'}
        lastLocation: {$ref: '#/components/schemas/GeoPoint'}
        lastSeenAt: {type: string, format: date-time}
        activeAssignments: {type: integer, minimum: 0}
        currentAssignment: {$ref: '#/components/schemas/TeamCurrentAssignment'}
        silent: {type: boolean, description: 'On a case with no update past the reporting deadline'}
        createdAt: {type: string, format: date-time}
    TeamCurrentAssignment:
      type: object
      required: [assignmentId, caseCode, status]
      properties:
        assignmentId: {type: string, format: uuid}
        caseCode: {type: string}
        place: {type: string}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        lastUpdateAt: {type: string, format: date-time}
    TeamCreateRequest:
      type: object
      required: [name, phone, vehicle]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        phone: {type: string, maxLength: 20}
        vehicle: {$ref: '#/components/schemas/VehicleType'}
        capacity: {type: integer, minimum: 0}
        areaDescription: {type: string}
        status: {$ref: '#/components/schemas/TeamStatus'}
    TeamUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        phone: {type: string, maxLength: 20}
        vehicle: {$ref: '#/components/schemas/VehicleType'}
        capacity: {type: integer, minimum: 0}
        areaDescription: {type: string}
        status: {$ref: '#/components/schemas/TeamStatus'}
        isActive: {type: boolean}
        lastLocation: {$ref: '#/components/schemas/GeoPoint'}

    # ---------- Missions
    MissionSummary:
      type: object
      required: [assignmentId, caseCode, priority, status, teamName]
      properties:
        assignmentId: {type: string, format: uuid}
        caseCode: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        teamName: {type: string}
        peopleCount: {type: integer, minimum: 0}
        vulnerable:
          type: array
          items: {$ref: '#/components/schemas/VulnerableGroup'}
        situation: {type: string}
        place: {type: string, description: 'Only the commune name after the mission ends'}
        acceptDueAt: {type: string, format: date-time}
        outcome: {$ref: '#/components/schemas/AssignmentOutcome'}
        peopleRescued: {type: integer, minimum: 0}
        completedAt: {type: string, format: date-time}
    MissionDetail:
      allOf:
        - {$ref: '#/components/schemas/MissionSummary'}
        - type: object
          required: [phones, originalMessages, locationSource]
          properties:
            addressText: {type: string}
            location: {$ref: '#/components/schemas/GeoPoint'}
            locationSource: {$ref: '#/components/schemas/LocationSource'}
            phones:
              type: array
              items: {type: string}
            originalMessages:
              type: array
              items: {$ref: '#/components/schemas/MissionMessage'}
    MissionMessage:
      type: object
      required: [reportId, receivedAt]
      properties:
        reportId: {type: string, format: uuid}
        text: {type: string}
        attachmentIds:
          type: array
          items: {type: string, format: uuid}
        receivedAt: {type: string, format: date-time}
    MissionAcceptRequest:
      type: object
      properties:
        occurredAt: {type: string, format: date-time}
        gps: {$ref: '#/components/schemas/GeoPoint'}
    MissionDeclineRequest:
      type: object
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/DeclineReason'}
        note: {type: string}
    MissionUpdateRequest:
      type: object
      description: '`OUTCOME` requires `outcome`; `RESCUED` requires `peopleRescued`.'
      required: [kind, occurredAt]
      properties:
        kind: {$ref: '#/components/schemas/TeamUpdateKind'}
        occurredAt: {type: string, format: date-time, description: 'Device time when the button was pressed'}
        outcome: {$ref: '#/components/schemas/AssignmentOutcome'}
        peopleRescued: {type: integer, minimum: 0}
        note: {type: string}
        gps: {$ref: '#/components/schemas/GeoPoint'}
    MissionUpdateReceipt:
      type: object
      required: [clientUpdateId, assignmentId, kind, receivedAt, replayed, applied, assignmentStatus, caseStatus]
      properties:
        clientUpdateId: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TeamUpdateKind'}
        receivedAt: {type: string, format: date-time}
        replayed: {type: boolean, description: 'The record exists from an earlier send'}
        applied: {type: boolean, description: '`false` when the assignment has ended; the update is still saved'}
        assignmentStatus: {$ref: '#/components/schemas/AssignmentStatus'}
        caseStatus: {$ref: '#/components/schemas/CaseStatus'}

    # ---------- Reports
    EventDashboard:
      type: object
      required: [eventId, generatedAt, totals, reportsByHour, timeToTeam, stuckCases, byStatus, byPriority]
      properties:
        eventId: {type: string, format: uuid}
        generatedAt: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/DashboardTotals'}
        reportsByHour:
          type: array
          items: {$ref: '#/components/schemas/HourCount'}
        timeToTeam:
          type: array
          items: {$ref: '#/components/schemas/PriorityTiming'}
        stuckCases:
          type: array
          items: {$ref: '#/components/schemas/StuckCase'}
        byStatus:
          type: array
          items: {$ref: '#/components/schemas/StatusCount'}
        byPriority:
          type: array
          items: {$ref: '#/components/schemas/PriorityCount'}
    DashboardTotals:
      type: object
      required: [reportsReceived, mergedCases, duplicateRate, realCases, invalidCases, p1Unassigned, p1Overdue, resolvedCases, peopleHelped, openCases]
      properties:
        reportsReceived: {type: integer, minimum: 0}
        mergedCases: {type: integer, minimum: 0}
        duplicateRate: {type: number, minimum: 0, maximum: 1}
        realCases: {type: integer, minimum: 0}
        invalidCases: {type: integer, minimum: 0}
        p1Unassigned: {type: integer, minimum: 0}
        p1Overdue: {type: integer, minimum: 0}
        resolvedCases: {type: integer, minimum: 0}
        peopleHelped: {type: integer, minimum: 0}
        openCases: {type: integer, minimum: 0}
    HourCount:
      type: object
      required: [hour, count]
      properties:
        hour: {type: string, format: date-time, description: Start of the hour}
        count: {type: integer, minimum: 0}
    PriorityTiming:
      type: object
      required: [priority, cases, lateCount]
      properties:
        priority: {$ref: '#/components/schemas/Priority'}
        cases: {type: integer, minimum: 0}
        medianToTeamMinutes: {type: integer, minimum: 0}
        slaMinutes: {type: integer, minimum: 0, description: 'P4 has no deadline'}
        lateCount: {type: integer, minimum: 0}
        medianToResolveMinutes: {type: integer, minimum: 0}
    StuckCase:
      type: object
      required: [caseId, caseCode, priority, reason, minutes]
      properties:
        caseId: {type: string, format: uuid}
        caseCode: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        summary: {type: string}
        place: {type: string}
        reason: {type: string, enum: [TEAM_SILENT, OVERDUE, DUE_SOON]}
        minutes: {type: integer, minimum: 0, description: 'Minutes silent, overdue or remaining'}
        teamName: {type: string}
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: {$ref: '#/components/schemas/CaseStatus'}
        count: {type: integer, minimum: 0}
    PriorityCount:
      type: object
      required: [priority, count]
      properties:
        priority: {$ref: '#/components/schemas/Priority'}
        count: {type: integer, minimum: 0}
    AfterActionReport:
      type: object
      required: [eventId, eventName, totals, byPriority, unreachedCases]
      properties:
        eventId: {type: string, format: uuid}
        eventName: {type: string}
        closedAt: {type: string, format: date-time}
        totals:
          type: object
          required: [reportsReceived, duplicateReports, duplicateRate, realCases, invalidCases, resolvedCases, unreachedCases, peopleHelped, peopleHelpedP1, lateAssignments]
          properties:
            reportsReceived: {type: integer, minimum: 0}
            duplicateReports: {type: integer, minimum: 0}
            duplicateRate: {type: number, minimum: 0, maximum: 1}
            realCases: {type: integer, minimum: 0}
            invalidCases: {type: integer, minimum: 0}
            resolvedCases: {type: integer, minimum: 0}
            unreachedCases: {type: integer, minimum: 0}
            peopleHelped: {type: integer, minimum: 0}
            peopleHelpedP1: {type: integer, minimum: 0}
            lateAssignments: {type: integer, minimum: 0}
        byPriority:
          type: array
          items: {$ref: '#/components/schemas/PriorityTiming'}
        unreachedCases:
          type: array
          items: {$ref: '#/components/schemas/UnreachedCase'}
        lessonsLearned: {type: string}
    UnreachedCase:
      type: object
      required: [caseCode, priority, outcome]
      properties:
        caseCode: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        place: {type: string}
        outcome: {$ref: '#/components/schemas/AssignmentOutcome'}
        note: {type: string}
    LessonsLearnedRequest:
      type: object
      required: [lessonsLearned]
      properties:
        lessonsLearned: {type: string}
    AiQuality:
      type: object
      required: [eventId, reviewedCases, p1Recall, priorityRaised, priorityLowered, mergeSuggestions, latency, cost, fields, priorityMatrix, raisedCases]
      properties:
        eventId: {type: string, format: uuid}
        reviewedCases: {type: integer, minimum: 0}
        p1Recall:
          type: object
          required: [caught, total]
          properties:
            caught: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
        priorityRaised: {type: integer, minimum: 0}
        priorityLowered: {type: integer, minimum: 0}
        mergeSuggestions:
          type: object
          required: [accepted, total, pending]
          properties:
            accepted: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
        latency:
          type: object
          required: [averageMs, maxMs, failures]
          properties:
            averageMs: {type: integer, minimum: 0}
            maxMs: {type: integer, minimum: 0}
            failures: {type: integer, minimum: 0}
        cost:
          type: object
          required: [usd, cases]
          properties:
            usd: {type: number, minimum: 0}
            cases: {type: integer, minimum: 0}
        fields:
          type: array
          items: {$ref: '#/components/schemas/AiFieldAccuracy'}
        priorityMatrix:
          type: array
          items: {$ref: '#/components/schemas/AiPriorityRow'}
        raisedCases:
          type: array
          items: {$ref: '#/components/schemas/AiRaisedCase'}
    AiFieldAccuracy:
      type: object
      required: [field, correct, graded, rate]
      properties:
        field: {type: string}
        correct: {type: integer, minimum: 0}
        graded: {type: integer, minimum: 0}
        rate: {type: number, minimum: 0, maximum: 1}
    AiPriorityRow:
      type: object
      required: [aiPriority, finalP1, finalP2, finalP3, finalP4]
      properties:
        aiPriority: {$ref: '#/components/schemas/Priority'}
        finalP1: {type: integer, minimum: 0}
        finalP2: {type: integer, minimum: 0}
        finalP3: {type: integer, minimum: 0}
        finalP4: {type: integer, minimum: 0}
    AiRaisedCase:
      type: object
      required: [caseId, caseCode, aiPriority, finalPriority]
      properties:
        caseId: {type: string, format: uuid}
        caseCode: {type: string}
        aiPriority: {$ref: '#/components/schemas/Priority'}
        finalPriority: {$ref: '#/components/schemas/Priority'}
        reason: {type: string}
        correctedByName: {type: string}

    # ---------- Accounts, audit log, system
    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string, description: 'Absent until activated'}
        phone: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        teamId: {type: string, format: uuid}
