ên mái nhà, có trẻ 8 tháng và 2 người già</text><text x="444" y="202" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Gần cầu Sông Ba, thôn 3, Hòa Thịnh · 3 người</text><text x="444" y="226" font-size="13" fill="#047857" font-weight="600" text-anchor="start">Xác minh: Đã gọi được lúc 14:06</text><text x="428" y="276" font-size="14" fill="#111827" font-weight="700" text-anchor="start">Đội được gợi ý</text><rect x="428" y="290" width="584" height="74" rx="6" fill="#e8f1fb" stroke="#1168bd" stroke-width="2"/><circle cx="456" cy="327" r="9" fill="#1168bd" stroke="#1168bd"/><text x="482" y="322" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Đội 1</text><text x="482" y="346" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Thuyền · 1,2 km · 0 nhiệm vụ</text><rect x="884" y="316" width="91.19999999999999" height="20" rx="10" fill="#e8f1fb" stroke="#e8f1fb" stroke-width="1"/><text x="929.6" y="330" font-size="11" fill="#1168bd" font-weight="700" text-anchor="middle">Phù hợp nhất</text><rect x="428" y="374" width="584" height="74" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><circle cx="456" cy="411" r="9" fill="#ffffff" stroke="#d1d5db"/><text x="482" y="406" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Đội 5</text><text x="482" y="430" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Thuyền · 3,4 km · 0 nhiệm vụ</text><rect x="428" y="458" width="584" height="74" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><circle cx="456" cy="495" r="9" fill="#ffffff" stroke="#d1d5db"/><text x="482" y="490" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Đội 4</text><text x="482" y="514" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Đi bộ · 0,8 km · 1 nhiệm vụ</text><rect x="428" y="552" width="584" height="58" rx="6" fill="#fef3c7" stroke="#fef3c7" stroke-width="1"/><text x="444" y="576" font-size="13" fill="#b45309" font-weight="600" text-anchor="start">Khoảng cách đường chim bay, chưa tính đường ngập.</text><text x="444" y="598" font-size="13" fill="#b45309" font-weight="400" text-anchor="start">Hãy xác nhận với đội trước khi điều động.</text><text x="428" y="642" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Đội có 5 phút để nhận; quá hạn ca quay lại hàng đợi.</text><rect x="428" y="672" width="180" height="48" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="518.0" y="701.5" font-size="13" fill="#111827" font-weight="600" text-anchor="middle">Hủy</text><rect x="748" y="672" width="264" height="48" rx="6" fill="#1168bd" stroke="#1168bd" stroke-width="1"/><text x="880.0" y="702.5" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Phân công Đội 1</text></svg>