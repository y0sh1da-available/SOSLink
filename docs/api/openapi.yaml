openapi: 3.0.4
info:
  title: SOSLink API
  version: 1.0.0
  description: |
    REST contract of SOSLink, covering intake, case review, assignment, rescue team missions,
    reports and administration.

    The backend is the authorization boundary: each operation checks the roles in `x-roles` and the limits in
    `x-scope`. `x-stories` lists the user stories the operation serves.

    This document is a design contract (TARGET V1). No operation runs yet.
  contact:
    name: SOSLink
servers:
  - url: /api/v1
    description: Version 1, relative to the deployment host
  - url: http://localhost:5000/api/v1
    description: Development machine
tags:
  - name: Public
    description: Residents send messages and look up by code. No token needed, never returns personal data.
  - name: Auth
    description: Login, logout, account activation by invitation link.
  - name: Profile
    description: Profile of the logged-in user. The role cannot be changed.
  - name: Events
    description: Disaster events and the deadlines of each event.
  - name: Config
    description: Danger keywords and administrative units.
  - name: Reports
    description: Original messages. Not edited or deleted before anonymisation (BR01).
  - name: Cases
    description: Normalised cases, covering review, editing, merging, verification and the timeline.
  - name: Dispatch
    description: Team suggestions and assignment. Only people assign (BR14).
  - name: Alerts
    description: Alerts for coordinators. The Worker creates them, a person acknowledges them.
  - name: Teams
    description: Rescue teams, vehicles, areas and status.
  - name: Missions
    description: 'Rescue team screens: accept, decline and report outcomes, even offline.'
  - name: Analytics
    description: Dashboard, after-action report, AI quality, data export.
  - name: Users
    description: Account management. No hard delete.
  - name: Audit
    description: Log of sensitive actions.
  - name: Webhooks
    description: External channels sending messages into the system.
  - name: System
    description: Service health checks.
security:
  - bearerAuth: []
paths:
  /public/form-status:
    get:
      tags: [Public]
      summary: Check whether the form is accepting messages
      description: |
        With no open event, `accepting` is `false`; the form stops accepting messages and only shows 112.
        With several open events, the frontend shows a list for the sender to choose from.
      operationId: getFormStatus
      security: []
      x-roles: [PUBLIC]
      x-stories: [US03, US23]
      responses:
        '200':
          description: Form status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FormStatus'}
              examples:
                oneOpenEvent: {$ref: '#/components/examples/FormStatusExample'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/reports:
    post:
      tags: [Public]
      summary: Send a call for help
      description: |
        Saves the original before any AI processing and returns a tracking code at once (BR01, BR07). Must have `gps` or `placeText`.
        The server joins `placeText` and `situationText` into `reports.raw_text`.

        Resending the same `idempotencyKey` returns `200` with the existing code and creates no duplicate.
        An IP sending over 10 messages in 10 minutes gets `429` with a `confirmToken`. The sender confirms and resends
        the same content; the system never silently drops a message.
      operationId: submitPublicReport
      security: []
      x-roles: [PUBLIC]
      x-stories: [US03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicReportRequest'}
            examples:
              withGps: {$ref: '#/components/examples/PublicReportRequestExample'}
      responses:
        '201':
          description: Message saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicReportCreated'}
              examples:
                created: {$ref: '#/components/examples/PublicReportCreatedExample'}
        '200':
          description: Resent with the same `idempotencyKey`; returns the issued code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicReportCreated'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409':
          description: |
            `EVENT_CLOSED` when no event is open. `EVENT_SELECTION_REQUIRED` when several are open and no `eventId` was chosen.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '429': {$ref: '#/components/responses/ConfirmationRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/reports/{trackingCode}/attachments:
    post:
      tags: [Public]
      summary: Send an image with a message
      description: |
        Sent after the tracking code is issued, one image at a time, so a weak network cannot lose the text.
        Up to 4 images, each up to 5 MB.
      operationId: uploadPublicAttachment
      security: []
      x-roles: [PUBLIC]
      x-stories: [US03]
      parameters:
        - {$ref: '#/components/parameters/TrackingCodePath'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: 'JPEG, PNG or WebP image'}
      responses:
        '201':
          description: Image saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttachmentRef'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AttachmentLimitReached'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/track/{trackingCode}:
    get:
      tags: [Public]
      summary: Look up status by code
      description: |
        Returns general steps only, with no name, phone or address (BR19). Anyone with the code can see it.
        A merged case follows the main case. A not-verified case shows as `CLOSED`, with no reason.
      operationId: trackReport
      security: []
      x-roles: [PUBLIC]
      x-stories: [US04]
      parameters:
        - {$ref: '#/components/parameters/TrackingCodePath'}
      responses:
        '200':
          description: Steps reached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrackResponse'}
              examples:
                teamAssigned: {$ref: '#/components/examples/TrackExample'}
        '404':
          description: '`TRACKING_CODE_NOT_FOUND`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns a 60-minute JWT. Every failure, including an account locked for 15 minutes after 5 failures,
        returns the same `AUTH_INVALID_CREDENTIALS` error, so it does not reveal whether an account exists.
      operationId: login
      security: []
      x-roles: [PUBLIC]
      x-stories: [US01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            examples:
              coordinator: {$ref: '#/components/examples/LoginRequestExample'}
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                coordinator: {$ref: '#/components/examples/LoginSuccessExample'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: The client deletes the token and locally stored data. V1 has no refresh token and no server-side revocation.
      operationId: logout
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US01]
      responses:
        '204': {description: 'Logout acknowledged'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/invitations/inspect:
    post:
      tags: [Auth]
      summary: View invitation link details
      description: Uses POST so the token stays in the body, out of access logs. Wrong, expired or used tokens all return the same error.
      operationId: inspectInvitation
      security: []
      x-roles: [PUBLIC]
      x-stories: [US21]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationTokenRequest'}
      responses:
        '200':
          description: Details to show at SCR-05
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationInfo'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '410': {$ref: '#/components/responses/InvitationInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Activate account
      description: Sets name and password and moves the account to `ACTIVE`. The link stops working immediately after use.
      operationId: acceptInvitation
      security: []
      x-roles: [PUBLIC]
      x-stories: [US21]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationAcceptRequest'}
      responses:
        '204': {description: 'Activated'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '410': {$ref: '#/components/responses/InvitationInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}

  /me:
    get:
      tags: [Profile]
      summary: View my profile
      operationId: getMyProfile
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US02]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Profile]
      summary: Edit name and phone
      operationId: updateMyProfile
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US02]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses:
        '200':
          description: Profile after editing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /me/password:
    post:
      tags: [Profile]
      summary: Change password
      description: A wrong old password returns `400` with `errorCode` `PASSWORD_INCORRECT`.
      operationId: changeMyPassword
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US02]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204': {description: 'Password changed'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /events:
    get:
      tags: [Events]
      summary: List disaster events
      description: Used by the event picker in the top bar, SCR-50 and the anonymisation table at SCR-54.
      operationId: listEvents
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US23, US24]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/EventStatus'}, description: Filter by status}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: A page of disaster events, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Events]
      summary: Open a new event
      description: Deadlines take default values, edited later with `updateEvent`. Several events can be open at once.
      operationId: openEvent
      x-roles: [ADMIN]
      x-stories: [US23]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreateRequest'}
      responses:
        '201':
          description: Event opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventIdPath'}
    get:
      tags: [Events]
      summary: Event detail
      operationId: getEvent
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-stories: [US23]
      responses:
        '200':
          description: Disaster event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Events]
      summary: Edit name, area and deadlines
      description: New deadlines apply to cases created after saving.
      operationId: updateEvent
      x-roles: [ADMIN]
      x-stories: [US23]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdateRequest'}
      responses:
        '200':
          description: Event after editing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /events/{eventId}/close:
    post:
      tags: [Events]
      summary: Close event
      description: The public form stops accepting messages for this event. The anonymisation deadline counts from closing (BR21).
      operationId: closeEvent
      x-roles: [ADMIN]
      x-stories: [US23]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      responses:
        '200':
          description: Event closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /events/{eventId}/overview:
    get:
      tags: [Events]
      summary: Counters for the top bar
      description: P1 cases with no team, cases awaiting review, cases with no location, unacknowledged alerts.
      operationId: getEventOverview
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US14, US16]
      parameters:
        - {$ref: '#/components/parameters/EventIdPath'}
      responses:
        '200':
          description: Counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /danger-keywords:
    get:
      tags: [Config]
      summary: List danger keywords
      operationId: listDangerKeywords
      x-roles: [ADMIN]
      x-stories: [US23]
      responses:
        '200':
          description: Keywords in use
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DangerKeyword'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Config]
      summary: Add a keyword
      description: Keywords only raise the level, never lower it (BR04).
      operationId: addDangerKeyword
      x-roles: [ADMIN]
      x-stories: [US23]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DangerKeywordCreateRequest'}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DangerKeyword'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /danger-keywords/{keywordId}:
    delete:
      tags: [Config]
      summary: Remove a keyword
      description: Sets `is_active` to `false`; the record is not deleted.
      operationId: removeDangerKeyword
      x-roles: [ADMIN]
      x-stories: [US23]
      parameters:
        - {name: keywordId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: 'Removed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin-units:
    get:
      tags: [Config]
      summary: List provinces and communes
      description: The list after the 2025 merger. Used to filter cases by area and to pick a commune during review.
      operationId: listAdminUnits
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US14]
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [PROVINCE, COMMUNE]}}
        - {name: parentId, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string}, description: Search by name}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: A page of administrative units
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUnitPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /reports:
    post:
      tags: [Reports]
      summary: Enter a message from social media
      description: |
        Must have text or at least one image. Saved and returned within 2 seconds; AI processes in the background (BR07).
        Up to 4 images, each up to 5 MB. Resending the same `idempotencyKey` returns `200` with the existing message.
      operationId: createReport
      x-roles: [VOLUNTEER, COORDINATOR, ADMIN]
      x-stories: [US05]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ReportCreateForm'}
            encoding:
              photos: {contentType: 'image/jpeg, image/png, image/webp'}
      responses:
        '201':
          description: Message saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSummary'}
        '200':
          description: Resent with the same `idempotencyKey`; returns the saved message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSummary'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`EVENT_CLOSED` when the event is closed'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Reports]
      summary: List messages
      description: '`VOLUNTEER` always gets only their own messages, regardless of `mine` (BR20).'
      operationId: listReports
      x-roles: [VOLUNTEER, COORDINATOR, ADMIN]
      x-scope: 'VOLUNTEER: messages they entered'
      x-stories: [US05, US13]
      parameters:
        - {$ref: '#/components/parameters/EventIdQuery'}
        - {name: mine, in: query, schema: {type: boolean, default: false}}
        - {name: caseStatus, in: query, schema: {$ref: '#/components/schemas/CaseStatus'}}
        - {name: aiStatus, in: query, schema: {$ref: '#/components/schemas/AiStatus'}}
        - {name: channel, in: query, schema: {$ref: '#/components/schemas/ReportChannel'}}
        - {name: receivedFrom, in: query, schema: {type: string, format: date-time}}
        - {name: q, in: query, schema: {type: string}, description: Search message content}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: A page of messages, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Original message detail
      operationId: getReport
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-scope: 'VOLUNTEER: messages they entered. TEAM: messages of the assigned case, while the mission runs (BR20)'
      x-stories: [US05, US07]
      parameters:
        - {$ref: '#/components/parameters/ReportIdPath'}
      responses:
        '200':
          description: Original message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /reports/{reportId}/attachments/{attachmentId}:
    get:
      tags: [Reports]
      summary: Download a message image
      operationId: downloadReportAttachment
      x-roles: [VOLUNTEER, COORDINATOR, TEAM, ADMIN]
      x-scope: Same limits as getReport
      x-stories: [US05, US11, US17]
      parameters:
        - {$ref: '#/components/parameters/ReportIdPath'}
        - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Image content
          content:
            image/*:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /cases:
    get:
      tags: [Cases]
      summary: List cases, queue and map data
      description: |
        Sorted by priority then waiting time by default. Cases with no location stay in the results (`hasLocation=false`).
        After reconnecting realtime, the client calls again with `updatedSince` to fetch what it missed.
      operationId: listCases
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US10, US11, US14]
      parameters:
        - {$ref: '#/components/parameters/EventIdQueryRequired'}
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: '#/components/schemas/CaseStatus'}
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: '#/components/schemas/Priority'}
        - {name: needsHumanRead, in: query, schema: {type: boolean}}
        - {name: hasLocation, in: query, schema: {type: boolean}}
        - {name: overdue, in: query, schema: {type: boolean}, description: Past the assignment deadline}
        - {name: communeId, in: query, schema: {type: string, format: uuid}}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string}, description: 'Search case code, place, condition'}
        - {name: updatedSince, in: query, schema: {type: string, format: date-time}}
        - name: sort
          in: query
          schema: {type: string, enum: [queue, newest], default: queue}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
