        the team on the main case is notified (BR09, BR10). AI only suggests; only a person can merge (BR02).
      operationId: mergeCase
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US12]
      parameters:
        - {$ref: '#/components/parameters/CaseIdPath'}
      requestBody:
        required: true
