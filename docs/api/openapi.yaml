        invitationExpiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    UserInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        teamId: {type: string, format: uuid, description: 'Required when the role is `TEAM`'}
    UserInviteResponse:
      type: object
      required: [user, inviteUrl, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/User'}
        inviteUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    InvitationLink:
      type: object
      required: [inviteUrl, expiresAt]
      properties:
        inviteUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, maxLength: 20}
        role: {$ref: '#/components/schemas/UserRole'}
        teamId: {type: string, format: uuid, nullable: true}
    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: {type: integer, format: int64}
        actorId: {type: string, format: uuid}
        actorName: {type: string}
        action: {type: string, example: VIEW_PHONE}
        entityType: {type: string, example: case}
        entityId: {type: string, format: uuid}
        entityLabel: {type: string, example: '#1046'}
        metadata:
          type: object
          additionalProperties: true
        createdAt: {type: string, format: date-time}
    ZaloWebhookEvent:
      type: object
      description: Content is defined by Zalo; only the fields the system reads are listed.
      additionalProperties: true
      required: [event_name]
      properties:
        event_name: {type: string}
        timestamp: {type: string}
    Health:
      type: object
      required: [status, database, checkedAt]
      properties:
        status: {type: string, enum: [ok, degraded, down]}
        database: {type: string, enum: [ok, down]}
        pendingAiReports: {type: integer, minimum: 0}
        lastWorkerRunAt: {type: string, format: date-time}
        checkedAt: {type: string, format: date-time}

