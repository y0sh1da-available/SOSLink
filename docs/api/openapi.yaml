    post:
      tags: [Dispatch]
      summary: Assign a team
      description: |
        Moves the case to `ASSIGNED`; the team has 5 minutes to accept (BR15). When two people assign at once, only one command succeeds;
        the other gets `409` with the team and who assigned it (AC-US15).
