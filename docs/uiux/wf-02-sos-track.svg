<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>SCR-02/03 Đã gửi và tra cứu</title><rect x="0" y="0" width="390" height="844" rx="26" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><rect x="0" y="0" width="390" height="60" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="18" y="38" font-size="16" fill="#111827" font-weight="700" text-anchor="start">Tình trạng tin của bạn</text><rect x="14" y="72" width="362" height="110" rx="10" fill="#d1fae5" stroke="#d1fae5" stroke-width="1"/><text x="195" y="104" font-size="16" fill="#047857" font-weight="700" text-anchor="middle">Đã nhận được tin của bạn</text><text x="195" y="136" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Mã tra cứu</text><text x="195" y="164" font-size="24" fill="#111827" font-weight="700" text-anchor="middle">SOS-7K2Q</text><text x="14" y="220" font-size="14" fill="#111827" font-weight="700" text-anchor="start">Tiến trình</text><circle cx="34" cy="256" r="11" fill="#047857" stroke="#047857"/><line x1="34" y1="267" x2="34" y2="311" stroke="#047857" stroke-width="2"/><text x="58" y="261" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Đã nhận tin</text><text x="372" y="261" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">14:02</text><circle cx="34" cy="322" r="11" fill="#047857" stroke="#047857"/><line x1="34" y1="333" x2="34" y2="377" stroke="#047857" stroke-width="2"/><text x="58" y="327" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Đang xử lý</text><text x="372" y="327" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">14:05</text><circle cx="34" cy="388" r="11" fill="#047857" stroke="#047857"/><line x1="34" y1="399" x2="34" y2="443" stroke="#d1d5db" stroke-width="2"/><text x="58" y="393" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Đã có đội nhận</text><text x="372" y="393" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">14:11</text><circle cx="34" cy="454" r="11" fill="#ffffff" stroke="#d1d5db"/><text x="58" y="459" font-size="15" fill="#9ca3af" font-weight="600" text-anchor="start">Đã xử lý</text><text x="372" y="459" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end"></text><rect x="14" y="512" width="362" height="84" rx="10" fill="#fee2e2" stroke="#fee2e2" stroke-width="1"/><text x="30" y="542" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start">Nếu tình hình xấu đi, hãy gọi 112.</text><text x="30" y="570" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Giữ điện thoại, đội có thể gọi cho bạn.</text><rect x="14" y="616" width="362" height="48" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="195.0" y="646.0" font-size="14" fill="#111827" font-weight="600" text-anchor="middle">Gửi thêm thông tin mới</text><text x="195" y="700" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Trang này không hiện tên, điện thoại và địa chỉ.</text></svg>