    patch:
      tags: [Cases]
      summary: Edit case information
      description: |
        Stores both the AI value and the final human value to measure AI quality. Must send the current `version`.
        Lowering priority requires `priorityReason`; raising it does not (AC-US11).
      operationId: updateCase
      x-roles: [COORDINATOR, ADMIN]
      x-stories: [US10, US11]
      requestBody:
        required: true
